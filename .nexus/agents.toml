# Nexus 子智能体引擎配置
# 用于覆盖内置引擎或新增自定义引擎（字段级合并：未配置的字段沿用内置值）
# 内置引擎: explorer(探索) / coder(编码) / reviewer(审查) / researcher(调研)
# 协作拓扑: dispatch_agent(单引擎) / dispatch_agents(并行) / run_pipeline(流水线)

# === 示例 1: 覆盖内置引擎（只改 model 和 max_iterations，其余沿用内置值） ===
# [[agents]]
# name = "explorer"
# description = "只读探索代码库：搜索符号、阅读文件、理解模块结构与依赖关系"
# system_prompt = "你是代码探索引擎，只读分析代码库..."
# model = "deepseek-v4-flash"
# tools = ["read_file", "grep", "glob", "list_directory", "search_symbol", "semantic_search"]
# writable = false
# max_iterations = 8

# === 示例 2: 新增自定义引擎 ===
# [[agents]]
# name = "translator"
# description = "翻译引擎：中英互译与术语统一"
# system_prompt = "你是翻译引擎，只读分析代码中的文案，输出对照表与术语建议。"
# model = "deepseek-v4-flash"
# tools = ["read_file", "grep", "glob"]
# writable = false
# max_iterations = 6

# === 字段说明 ===
# name            引擎名（必填），供 LLM 路由选择
# description     给 LLM 的路由描述，说明何时选择该引擎
# system_prompt   角色提示词，注入子 Agent 首条消息
# model           可选，指定模型名；缺省用 executor 模型
# tools           工具白名单；缺省按 writable 自动选择
# writable        默认写权限（true/false）
# max_iterations  默认迭代上限
# requires_approval  预留字段（当前审批由工具级控制）

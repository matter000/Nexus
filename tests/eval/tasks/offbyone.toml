[id]
name = "修复分页越界"
category = "bug-fix"
difficulty = "easy"
description = "修复 paginate 函数 slice 上界越界的 off-by-one bug"

[request]
user_prompt = "修复 paginate 函数的分页 bug：当前每页会多返回一条数据，页码边界不正确。仅修改 src/paginate.ts，不要创建或修改其他文件"

[[initial_files]]
path = "src/paginate.ts"
content = """
export interface Page<T> {
  items: T[]
  page: number
  pageSize: number
}

export function paginate<T>(list: T[], page: number, pageSize: number): Page<T> {
  const start = (page - 1) * pageSize
  const end = start + pageSize + 1
  return { items: list.slice(start, end), page, pageSize }
}
"""

[[validate]]
type = "file_not_contains"
path = "src/paginate.ts"
pattern = "pageSize + 1"

[[validate]]
type = "file_contains"
path = "src/paginate.ts"
pattern = "slice(start"

[[validate]]
type = "no_extra_files"
allowed = ["src/paginate.ts"]

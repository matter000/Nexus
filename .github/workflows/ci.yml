name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type check
        run: bun run lint

      - name: Unit tests
        run: bun test tests/unit/ tests/integration/ --test-name-pattern '^(?:(?!Tree-sitter).)*$'

      - name: Tree-sitter tests (separate process to avoid WASM memory conflict)
        run: bun test tests/unit/treesitter.test.ts
